name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake qt@6 simde

      - name: Clone OBS 32.0.0 source + générer obsconfig.h
        run: |
          git clone --depth=1 --branch 32.0.0 \
            https://github.com/obsproject/obs-studio.git ~/obs-studio

          SIMDE_INC=$(brew --prefix simde)/include
          mkdir -p ~/cmake/SIMDe
          printf 'add_library(SIMDe::SIMDe INTERFACE IMPORTED)\ntarget_include_directories(SIMDe::SIMDe INTERFACE %s)\n' \
            "$SIMDE_INC" > ~/cmake/SIMDe/SIMDeConfig.cmake

          cmake -S ~/obs-studio -B ~/obs-studio/build \
            -G Xcode \
            -DENABLE_BROWSER=OFF -DENABLE_SCRIPTING=OFF \
            -DENABLE_UI=OFF -DENABLE_PLUGINS=OFF \
            -DSIMDe_DIR="$HOME/cmake/SIMDe" \
            --no-warn-unused-cli -Wno-dev 2>&1 | tail -5 || true

          OBSCONFIG=$(find ~/obs-studio/build -name "obsconfig.h" 2>/dev/null | head -1)
          if [ -z "$OBSCONFIG" ]; then
            mkdir -p ~/obs-studio/build/config
            printf '#pragma once\n#define OBS_RELEASE_CANDIDATE 0\n#define OBS_BETA 0\n' \
              > ~/obs-studio/build/config/obsconfig.h
            OBSCONFIG="$HOME/obs-studio/build/config/obsconfig.h"
          fi
          echo "OBS_CONFIG_DIR=$(dirname $OBSCONFIG)" >> $GITHUB_ENV

      - name: Download OBS arm64 frameworks
        run: |
          curl -L -o obs.dmg \
            "https://github.com/obsproject/obs-studio/releases/download/32.0.0/OBS-Studio-32.0.0-macOS-Apple.dmg"
          hdiutil attach obs.dmg -mountpoint /Volumes/OBS -nobrowse -quiet
          cp -R /Volumes/OBS/OBS.app/Contents/Frameworks ~/obs-frameworks
          hdiutil detach /Volumes/OBS -quiet

      - name: Build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOBS_SOURCE_DIR="$HOME/obs-studio" \
            -DOBS_FRAMEWORKS="$HOME/obs-frameworks" \
            -DOBS_CONFIG_DIR="$OBS_CONFIG_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DQt6_DIR="$(brew --prefix qt@6)/lib/cmake/Qt6" \
            -Wno-dev
          cmake --build build --parallel

      - name: Create .plugin bundle
        run: |
          PLUGIN=obs-timeline-monitor
          BUNDLE="$PLUGIN.plugin"
          BIN="build/$PLUGIN"

          for LIB in QtCore QtGui QtWidgets; do
            OLD=$(otool -L "$BIN" 2>/dev/null | grep "opt/homebrew.*$LIB" | awk '{print $1}')
            [ -n "$OLD" ] && install_name_tool -change "$OLD" \
              "@rpath/$LIB.framework/Versions/A/$LIB" "$BIN"
          done

          mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Resources/locale"
          cp "$BIN" "$BUNDLE/Contents/MacOS/$PLUGIN"
          cp data/locale/*.ini "$BUNDLE/Contents/Resources/locale/"

          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/@VERSION@/$VERSION/" data/macos/Info.plist > "$BUNDLE/Contents/Info.plist"

          codesign --force --deep --sign - "$BUNDLE"
          zip -r obs-timeline-monitor-macos-arm64.zip "$BUNDLE"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: obs-timeline-monitor-macos-arm64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
