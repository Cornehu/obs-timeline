name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ──────────────────────────────────────────────
  # macOS arm64 (Apple Silicon)
  # ──────────────────────────────────────────────
  build-macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake simde

      - name: Clone OBS 32.0.0 source (headers)
        run: |
          git clone --depth=1 --branch 32.0.0 \
            https://github.com/obsproject/obs-studio.git ~/obs-studio

          SIMDE_INC=$(brew --prefix simde)/include
          mkdir -p ~/cmake/SIMDe
          printf 'add_library(SIMDe::SIMDe INTERFACE IMPORTED)\ntarget_include_directories(SIMDe::SIMDe INTERFACE %s)\n' \
            "$SIMDE_INC" > ~/cmake/SIMDe/SIMDeConfig.cmake

          cmake -S ~/obs-studio -B ~/obs-studio/build \
            -G Xcode \
            -DENABLE_BROWSER=OFF -DENABLE_SCRIPTING=OFF \
            -DENABLE_UI=OFF -DENABLE_PLUGINS=OFF \
            -DSIMDe_DIR="$HOME/cmake/SIMDe" \
            --no-warn-unused-cli -Wno-dev 2>&1 | tail -3 || true

      - name: Download OBS arm64 frameworks
        run: |
          curl -L -o obs.dmg \
            "https://github.com/obsproject/obs-studio/releases/download/32.0.0/OBS-Studio-32.0.0-macOS-Apple.dmg"
          hdiutil attach obs.dmg -mountpoint /Volumes/OBS -nobrowse -quiet
          cp -R /Volumes/OBS/OBS.app/Contents/Frameworks ~/obs-frameworks
          hdiutil detach /Volumes/OBS -quiet

      - name: Build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOBS_SOURCE_DIR="$HOME/obs-studio" \
            -DOBS_FRAMEWORKS="$HOME/obs-frameworks" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -Wno-dev
          cmake --build build --parallel

      - name: Create .plugin bundle
        run: |
          PLUGIN=obs-timeline-monitor
          BUNDLE="$PLUGIN.plugin"
          BIN="build/$PLUGIN"

          for LIB in QtCore QtGui QtWidgets; do
            OLD=$(otool -L "$BIN" 2>/dev/null | grep "opt/homebrew.*$LIB" | awk '{print $1}')
            [ -n "$OLD" ] && install_name_tool -change "$OLD" \
              "@rpath/$LIB.framework/Versions/A/$LIB" "$BIN"
          done

          mkdir -p "$BUNDLE/Contents/MacOS"
          mkdir -p "$BUNDLE/Contents/Resources/locale"
          cp "$BIN" "$BUNDLE/Contents/MacOS/$PLUGIN"
          cp data/locale/*.ini "$BUNDLE/Contents/Resources/locale/"

          cat > "$BUNDLE/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>$PLUGIN</string>
            <key>CFBundleIdentifier</key><string>com.cornehu.$PLUGIN</string>
            <key>CFBundleName</key><string>$PLUGIN</string>
            <key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
          </dict></plist>
          EOF

          codesign --force --deep --sign - "$BUNDLE"
          zip -r obs-timeline-monitor-macos-arm64.zip "$BUNDLE"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: obs-timeline-monitor-macos-arm64.zip

  # ──────────────────────────────────────────────
  # Windows (64-bit)
  # ──────────────────────────────────────────────
  build-windows:
    name: Windows (64-bit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone OBS 32.0.0 source + build libobs only
        run: |
          git clone --depth 1 --branch 32.0.0 `
            https://github.com/obsproject/obs-studio.git C:\obs-source
          cmake -S C:\obs-source -B C:\obs-source\build `
            -DENABLE_BROWSER=OFF -DENABLE_SCRIPTING=OFF `
            -DENABLE_UI=OFF -DENABLE_PLUGINS=OFF `
            --no-warn-unused-cli -Wno-dev
          cmake --build C:\obs-source\build `
            --target libobs obs-frontend-api `
            --config Release --parallel
        shell: pwsh

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          arch: win64_msvc2019_64

      - name: Configure plugin
        run: |
          $LIBOBS = (Get-ChildItem C:\obs-source\build -Filter "libobsConfig.cmake" -Recurse | Select-Object -First 1).DirectoryName
          $FRONTEND = (Get-ChildItem C:\obs-source\build -Filter "obs-frontend-apiConfig.cmake" -Recurse | Select-Object -First 1).DirectoryName
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -Dlibobs_DIR="$LIBOBS" `
            -Dobs-frontend-api_DIR="$FRONTEND" `
            -Wno-dev
        shell: pwsh

      - name: Build plugin
        run: cmake --build build --config Release --parallel
        shell: pwsh

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path dist\obs-plugins\64bit
          New-Item -ItemType Directory -Force -Path dist\data\obs-plugins\obs-timeline-monitor
          Copy-Item build\Release\obs-timeline-monitor.dll dist\obs-plugins\64bit\
          Copy-Item -Recurse data\locale dist\data\obs-plugins\obs-timeline-monitor\
          Compress-Archive -Path dist\* -DestinationPath obs-timeline-monitor-windows.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: obs-timeline-monitor-windows.zip

  # ──────────────────────────────────────────────
  # Linux (Ubuntu 22.04)
  # ──────────────────────────────────────────────
  build-linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OBS dev headers (via PPA)
        run: |
          sudo add-apt-repository ppa:obsproject/obs-studio -y
          sudo apt-get update
          sudo apt-get install -y cmake qt6-base-dev libobs-dev

      - name: Find libobs cmake config path
        run: |
          LIBOBS_DIR=$(find /usr -name "libobsConfig.cmake" 2>/dev/null | head -1 | xargs dirname)
          FRONTEND_DIR=$(find /usr -name "obs-frontend-apiConfig.cmake" 2>/dev/null | head -1 | xargs dirname)
          echo "LIBOBS_DIR=$LIBOBS_DIR" >> $GITHUB_ENV
          echo "FRONTEND_DIR=$FRONTEND_DIR" >> $GITHUB_ENV
          echo "libobs cmake: $LIBOBS_DIR"
          echo "frontend cmake: $FRONTEND_DIR"

      - name: Build
        run: |
          EXTRA=""
          [ -n "$LIBOBS_DIR" ] && EXTRA="$EXTRA -Dlibobs_DIR=$LIBOBS_DIR"
          [ -n "$FRONTEND_DIR" ] && EXTRA="$EXTRA -Dobs-frontend-api_DIR=$FRONTEND_DIR"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=dist $EXTRA
          cmake --build build --parallel
          cmake --install build

      - name: Package
        run: tar -czf obs-timeline-monitor-linux.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: obs-timeline-monitor-linux.tar.gz

  # ──────────────────────────────────────────────
  # GitHub Release
  # ──────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            obs-timeline-monitor-macos-arm64.zip
            obs-timeline-monitor-windows.zip
            obs-timeline-monitor-linux.tar.gz
          generate_release_notes: true
